apiVersion: v1
kind: Secret
metadata:
  name: bestla-api-key
  namespace: bestla
stringData:
  api-key: "REPLACE_ME"
---
apiVersion: v1
kind: Pod
metadata:
  name: bestla
  namespace: bestla
  labels:
    app: bestla
spec:
  containers:
    - name: bestla
      image: raijenki/slurm:latest
      imagePullPolicy: "Always"
      ports:
        - name: http-port
          containerPort: 8080
        - name: ssh
          containerPort: 8822
        - name: jupyter
          containerPort: 8888
      env:
        - name: BESTLA_API_KEY
          valueFrom:
            secretKeyRef:
              name: bestla-api-key
              key: api-key
      securityContext:
        capabilities:
          add:
            - SYS_ADMIN
      livenessProbe:
        httpGet:
          path: /health
          port: http-port
        initialDelaySeconds: 60
        periodSeconds: 30
      readinessProbe:
        httpGet:
          path: /health
          port: http-port
        initialDelaySeconds: 30
        periodSeconds: 10
      resources:
        requests:
          memory: "1024Mi"
          cpu: 1
        limits:
          cpu: 1
          memory: "1024Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: bestla-svc
  namespace: bestla
spec:
  selector:
    app: bestla
  ports:
    - name: http
      protocol: TCP
      targetPort: http-port
      port: 80
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bestla-cert
  namespace: bestla
spec:
  secretName: bestla-tls-secret
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
  commonName: bestla.icedc.se
  dnsNames:
  - bestla.icedc.se
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bestla-ingress
  namespace: bestla
spec:
  ingressClassName: nginx
  rules:
    - host: bestla.icedc.se
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bestla-svc
                port:
                  number: 80
  tls:
  - secretName: bestla-tls-secret
    hosts:
    - bestla.icedc.se
